<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Día del Comprador - Pantalla Principal</title>
  <link rel="stylesheet" href="/static/css/common.css?v=20261003_v7">
  <link rel="stylesheet" href="/static/css/screen.css?v=20261003_v7">
</head>
<body>
  <div class="cosmic-bg">
    <!-- Smooth Animated Planetary Orbit Rings -->
    <div class="orbit-decor-1"></div>
    <div class="orbit-decor-2"></div>
    <div class="orbit-decor-3"></div>
    <!-- Radiant Cosmic Satellites with Glowing Motion -->
    <div class="orbit-satellite sat-top-right"></div>
    <div class="orbit-satellite sat-left"></div>
    <div class="orbit-satellite sat-bottom-right"></div>
    <div class="orbit-satellite sat-center-left"></div>
  </div>

  <div class="app-container">
    <div class="screen-wrapper">
      <!-- Ambient Cyber Corner Brackets -->
      <div class="screen-corner corner-tl"></div>
      <div class="screen-corner corner-tr"></div>
      <div class="screen-corner corner-bl"></div>
      <div class="screen-corner corner-br"></div>

      <!-- Corner Orbits & Floating Spheres (From Reference Design) -->
      <div class="screen-corner-orbits">
        <!-- Top-Left Corner Orbits & Spheres -->
        <div class="corner-system corner-sys-tl">
          <div class="c-orbit-arc arc-tl-1"></div>
          <div class="c-orbit-arc arc-tl-2"></div>
          <div class="c-orbit-node node-tl-white"></div>
          <div class="c-orbit-node node-tl-teal"></div>
        </div>

        <!-- Top-Right Corner Orbits & Spheres -->
        <div class="corner-system corner-sys-tr">
          <div class="c-orbit-arc arc-tr-1"></div>
          <div class="c-orbit-arc arc-tr-2"></div>
          <div class="c-orbit-node node-tr-teal"></div>
          <div class="c-orbit-node node-tr-white"></div>
        </div>

        <!-- Bottom-Left Concentric Orbits & Spheres (Reference Signature) -->
        <div class="corner-system corner-sys-bl">
          <div class="c-orbit-arc arc-bl-1"></div>
          <div class="c-orbit-arc arc-bl-2"></div>
          <div class="c-orbit-arc arc-bl-3"></div>
          <div class="c-orbit-node node-bl-teal-lg"></div>
          <div class="c-orbit-node node-bl-white-md"></div>
          <div class="c-orbit-node node-bl-teal-sm"></div>
          <div class="c-orbit-node node-bl-white-sm"></div>
        </div>

        <!-- Bottom-Right Accent Orbit & Sphere -->
        <div class="corner-system corner-sys-br">
          <div class="c-orbit-arc arc-br-1"></div>
          <div class="c-orbit-node node-br-teal"></div>
        </div>
      </div>

      <!-- Header -->
      <header class="screen-header">
        <div class="screen-brand">
          <img src="/static/img/logo_emendare.png" alt="Emendare Artem Emptionis" class="brand-logo-img">
        </div>
        <div class="header-meta">
          <span id="question-level" class="badge badge-teal">BÁSICO</span>
          <span id="question-counter" class="question-counter">1 / 30</span>
          <div id="screen-status-pill" class="badge badge-teal" style="font-size: 0.95rem; padding: 8px 18px; display: inline-flex; align-items: center; gap: 8px;">
            <span class="pill-dot dot-teal"></span>
            <span id="screen-status-text">ESPERANDO</span>
          </div>
        </div>
      </header>

      <!-- Center Stage -->
      <main class="stage-container">
        <!-- Cover / Lobby View -->
        <section id="view-cover" class="screen-cover">
          <div class="cover-logo-wrapper">
            <div class="logo-energy-halo"></div>
            <div class="logo-orbit-ring ring-outer"></div>
            <div class="logo-orbit-ring ring-inner"></div>
            <img src="/static/img/logo_circle.png" alt="Logo Emendare" class="cover-logo-img">
          </div>
          <img src="/static/img/trivia_title.png" alt="TRIVIA" class="cover-title-img">
          <img src="/static/img/dia_comprador.png" alt="Día del Comprador" class="cover-subtitle-img">
          <div class="lobby-status-pill">
            <span class="pulse-beacon"></span>
            <span class="lobby-status-text">Esperando al moderador para iniciar...</span>
          </div>
        </section>

        <!-- Active Question View -->
        <section id="view-game" style="display: none; flex-direction: column;">
          <div class="question-box">
            <h1 id="question-title" class="question-title">
              ¿Cuál es el principal objetivo del área de Compras?
            </h1>
          </div>

          <div id="options-grid" class="options-grid">
            <!-- 2x2 Options rendered dynamically -->
          </div>
        </section>

        <!-- Leaderboard View -->
        <section id="view-leaderboard" style="display: none;" class="card">
          <h2 style="font-family: var(--font-serif); font-size: 2.2rem; text-align: center; color: var(--accent-teal); margin-bottom: 8px;">
            🏆 RESULTADOS FINALES 🏆
          </h2>
          <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">
            Tabla de posiciones y puntuaciones de los equipos
          </p>
          <table class="leaderboard-table">
            <tbody id="leaderboard-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </section>
      </main>

      <!-- Footer Bar: Shows who is MISSING / PENDING to answer! -->
      <footer class="screen-footer">
        <div class="response-status-bar">
          <span class="response-counter-text">
            <span id="pending-label">Faltan por responder:</span> <strong id="pending-count">10</strong>
          </span>
          <div id="pending-chips" class="answered-chips-container">
            <!-- Chips of teams that have NOT answered yet -->
          </div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-dim); font-family: var(--font-mono);">
          SISTEMA DE QUIZ CON BOTONERAS • FASE 1
        </div>
      </footer>
    </div>
  </div>

  <script src="/static/js/ws.js"></script>
  <script src="/static/js/screen.js"></script>
</body>
</html>
